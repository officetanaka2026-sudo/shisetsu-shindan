  <rect x="-36" y="-14" width="72" height="28" rx="12" fill="#0b1f33"/>
  <rect x="-18" y="-8" width="36" height="8" rx="4" fill="#1769aa"/>
  <circle cx="0" cy="18" r="9" fill="#fff" stroke="#0b1f33" stroke-width="4"/>
  <circle cx="0" cy="18" r="3.5" fill="#1769aa"/>
