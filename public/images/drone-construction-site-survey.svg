<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="t d">
<title id="t">建設現場を撮影するドローンのイメージ</title><desc id="d">ドローンが建設現場を上空から撮影し、工程の進み具合を記録しているイメージです。</desc>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe3f3"/><stop offset="1" stop-color="#eaf3fb"/></linearGradient></defs>
<rect width="1000" height="700" fill="url(#sky)"/>

<rect x="0" y="560" width="1000" height="140" fill="#aebfce"/>
<!-- 建物の骨組み -->
<rect x="300" y="470" width="320" height="10" fill="#4a6b8a"/><rect x="300" y="380" width="320" height="10" fill="#4a6b8a"/><rect x="300" y="290" width="320" height="10" fill="#4a6b8a"/><rect x="300" y="200" width="320" height="10" fill="#4a6b8a"/>
<rect x="300" y="200" width="10" height="360" fill="#34597d"/><rect x="400" y="200" width="10" height="360" fill="#34597d"/><rect x="500" y="200" width="10" height="360" fill="#34597d"/><rect x="610" y="200" width="10" height="360" fill="#34597d"/>
<!-- クレーン -->
<rect x="760" y="140" width="14" height="420" fill="#d9a441"/>
<rect x="560" y="140" width="330" height="12" fill="#d9a441"/>
<path d="M760 140 L690 100 L840 100 Z" fill="none" stroke="#d9a441" stroke-width="5"/>
<path d="M600 152 V230" stroke="#0b1f33" stroke-width="3"/>
<rect x="585" y="230" width="30" height="22" fill="#0b1f33"/>
