<rect x="110" y="520" width="90" height="40" fill="#8ea6bd"/><rect x="130" y="490" width="90" height="30" fill="#7690a8"/>
<path d="M300 174 L120 540 L520 560 Z" fill="#1769aa" opacity="0.14"/>
<path d="M300 174 L120 540 M300 174 L520 560" stroke="#1769aa" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

<g transform="translate(300 150) scale(1.5)">
  <path d="M-34 -6 L-62 -22 M34 -6 L62 -22 M-34 6 L-62 22 M34 6 L62 22" stroke="#0b1f33" stroke-width="5" stroke-linecap="round"/>
